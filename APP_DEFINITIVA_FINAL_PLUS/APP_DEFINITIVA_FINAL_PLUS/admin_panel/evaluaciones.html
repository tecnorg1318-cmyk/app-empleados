
<!DOCTYPE html>
<html>
<head><title>Panel Evaluaciones - Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:sans-serif;background:#f5f7fb;margin:0}
header{background:#111;color:#fff;padding:15px}
.container{padding:20px;max-width:1100px;margin:auto}
.card{background:#fff;padding:20px;border-radius:12px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
input,select,textarea,button{padding:10px;border-radius:8px;border:1px solid #ddd;margin:5px}
button{background:#2ecc71;color:#fff;border:none;cursor:pointer}
button.danger{background:#e74c3c}
button.blue{background:#3498db}
.q{border-left:4px solid #2ecc71;padding-left:10px;margin:8px 0}
.stars{color:#f1c40f}
</style>
</head>
<body>
<header><h2>⭐ Evaluaciones Admin -> Empleado</h2><p>Admin crea preguntas | Evalúa con calificación, comentario y fotos | Empleado ve historial</p></header>
<div class="container">

<div class="card">
<h3>1. Crear Pregunta de Evaluación</h3>
<input id="texto" placeholder="Ej: Puntualidad" style="width:300px">
<select id="tipo">
<option value="calificacion">Calificación 1-5 estrellas</option>
<option value="texto">Texto libre</option>
<option value="si_no">Si / No</option>
<option value="foto">Foto evidencia</option>
</select>
<input id="desc" placeholder="Descripción opcional">
<button onclick="crearPregunta()">Agregar Pregunta</button>
<div id="listaPreguntas"></div>
</div>

<div class="card">
<h3>2. Evaluar Empleado</h3>
<select id="empleado">
<option value="1">Ruben Garcia (ID 1)</option>
</select>
<div id="formEval"></div>
<textarea id="comentarioGeneral" placeholder="Comentario general de la evaluación" style="width:100%;height:60px"></textarea>
<input id="fotos" placeholder="URLs fotos separadas por coma">
<button class="blue" onclick="evaluar()">Guardar Evaluación para Empleado</button>
</div>

<div class="card">
<h3>3. Historial de Evaluaciones</h3>
<button onclick="cargarEvaluaciones()">Cargar Evaluaciones</button>
<div id="historial"></div>
</div>

</div>
<script>
async function crearPregunta(){
  const r=await fetch('/api/admin/evaluaciones/preguntas',{method:'POST',headers:{'Content-Type':'application/json','X-User':'admin_demo'},body:JSON.stringify({texto:document.getElementById('texto').value,tipo:document.getElementById('tipo').value,descripcion:document.getElementById('desc').value})});
  alert(await r.text()); cargarPreguntas();
}
async function cargarPreguntas(){
  const r=await fetch('/api/admin/evaluaciones/preguntas',{headers:{'X-User':'admin_demo'}});
  const data=await r.json();
  let html=''; let form='';
  data.forEach(q=>{
    html+=`<div class="q"><b>${q.id}. ${q.texto}</b> [${q.tipo}] - ${q.descripcion||''} <button class="danger" onclick="eliminar(${q.id})">X</button></div>`;
    if(q.tipo=='calificacion') form+=`<div><label>${q.texto}:</label> <select data-q="${q.id}" class="resp"><option value="5">5 ⭐⭐⭐⭐⭐</option><option value="4">4 ⭐⭐⭐⭐</option><option value="3">3 ⭐⭐⭐</option><option value="2">2 ⭐⭐</option><option value="1">1 ⭐</option></select></div>`;
    else if(q.tipo=='texto') form+=`<div><label>${q.texto}:</label> <input data-q="${q.id}" class="resp-text" placeholder="Comentario"></div>`;
    else if(q.tipo=='si_no') form+=`<div><label>${q.texto}:</label> <select data-q="${q.id}" class="resp-text"><option>si</option><option>no</option></select></div>`;
    else if(q.tipo=='foto') form+=`<div><label>${q.texto}:</label> <input data-q="${q.id}" class="resp-foto" placeholder="URL foto"></div>`;
  });
  document.getElementById('listaPreguntas').innerHTML=html;
  document.getElementById('formEval').innerHTML=form;
}
async function eliminar(id){
  await fetch('/api/admin/evaluaciones/preguntas/'+id,{method:'DELETE',headers:{'X-User':'admin_demo'}});
  cargarPreguntas();
}
async function evaluar(){
  const respuestas=[];
  document.querySelectorAll('.resp').forEach(s=>{respuestas.push({pregunta_id:parseInt(s.dataset.q), calificacion: parseInt(s.value)})});
  document.querySelectorAll('.resp-text').forEach(s=>{respuestas.push({pregunta_id:parseInt(s.dataset.q), texto_respuesta: s.value})});
  document.querySelectorAll('.resp-foto').forEach(s=>{respuestas.push({pregunta_id:parseInt(s.dataset.q), foto_url: s.value})});
  const body={empleado_id: parseInt(document.getElementById('empleado').value), respuestas: respuestas, comentario_general: document.getElementById('comentarioGeneral').value, fotos_evidencia: document.getElementById('fotos').value.split(',')};
  const r=await fetch('/api/admin/evaluaciones/evaluar',{method:'POST',headers:{'Content-Type':'application/json','X-User':'admin_demo'},body:JSON.stringify(body)});
  alert(await r.text());
}
async function cargarEvaluaciones(){
  const r=await fetch('/api/empleado/mis_evaluaciones',{headers:{'X-User':'empleado_1'}});
  const data=await r.json();
  let html='';
  data.forEach(e=>{
    html+=`<div class="card" style="background:#fafafa"><b>${e.empleado_nombre} - ${e.fecha} - Promedio ${e.promedio.toFixed(1)}/5</b><br>Por: ${e.evaluado_por}<br>Comentario: ${e.comentario_general||''}<br>Fotos: ${e.fotos.join(',')}<br>Respuestas: ${JSON.stringify(e.respuestas)}</div>`;
  });
  document.getElementById('historial').innerHTML=html;
}
cargarPreguntas();
</script>
</body>
</html>
